<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Quick Sort Visualizer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Quick Sort Visualizer</h1>

        <p class="subtitle">
            Enter your own array and watch Quick Sort animation
        </p>

        <div class="input-section">

            <input
            type="text"
            id="array-input"
            placeholder="Example: 45,12,78,23,9">

            <button onclick="createArray()">
                Generate Bars
            </button>

            <button onclick="quickSortStart()">
                Start Sorting
            </button>

        </div>

        <div id="array-container"></div>

        <div id="status"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
